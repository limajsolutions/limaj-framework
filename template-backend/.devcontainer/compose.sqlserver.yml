# Fragmento DB — SQL Server 2022. Combine com o base no devcontainer.json:
#   "dockerComposeFile": ["docker-compose.yml", "compose.sqlserver.yml", ...]
#
# Acessível por hostname interno `sqlserver:1433` (NUNCA localhost dentro do container).
# Sem `ports:` — convive com um devops/ local que exponha 1433 no host.

services:
  app:
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: template-sqlserver-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Dev_Local_Pass_w0rd!"   # casa com post-create.sh; só dev
    volumes:
      - template_sqlserver_data_dev:/var/opt/mssql
    networks:
      - template_devnet
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -No -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  template_sqlserver_data_dev:
    name: template_sqlserver_data_dev
