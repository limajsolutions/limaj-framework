name: Publish packages

# Publica os 4 pacotes Limaj.Framework.* em GitHub Packages.
# Pipeline de 5 estagios condicionais: restore -> build -> test -> pack -> push.
# O estagio test bloqueia pack/push (falha aqui interrompe o job, nada e publicado).
#
# Dois gatilhos, ambos push autenticado (nunca pull_request/pull_request_target -
# exporia GITHUB_TOKEN com packages:write a codigo rodando a partir de um fork):
#   - push em main            -> pre-release (MinVer calcula X.Y.Z-<altura>+sha)
#   - push de tag vX.Y.Z      -> release estavel (MinVer resolve a versao exata da
#                                 tag, sem sufixo de pre-release), corte manual sem
#                                 gate formal (DA-006). Ver DA-003 em
#                                 docs/epics/em-andamento/nuget-package-publishing-pipeline.md.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer precisa do historico completo + tags para calcular a versao

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Limaj.Framework.sln

      - name: Build
        run: dotnet build Limaj.Framework.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Limaj.Framework.sln --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack Limaj.Framework.sln
          --configuration Release
          --no-build
          --output ./nupkgs
          -p:MinVerBuildMetadata=sha.${GITHUB_SHA::7}

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/limajsolutions/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
