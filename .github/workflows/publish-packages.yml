name: Publish packages

# Publica os 5 pacotes Limaj.Framework.* em dois feeds:
#   - GitHub Packages -> toda versao (pre-releases da main + releases estaveis); exige auth para ler.
#   - nuget.org       -> somente releases estaveis (tag vX.Y.Z); publico, sem auth para ler.
#     Login via Trusted Publishing (OIDC -> API key de ~1h, sem segredo de push guardado),
#     politica "limaj-framework" no nuget.org amarrada a este repo + este arquivo + environment
#     "nuget". O environment guarda o secret NUGET_USER (usuario do nuget.org, nao e credencial).
# Pipeline de 5 estagios condicionais: restore -> build -> test -> pack -> push.
# O estagio test bloqueia pack/push (falha aqui interrompe o job, nada e publicado).
#
# Dois gatilhos, ambos push autenticado (nunca pull_request/pull_request_target -
# exporia GITHUB_TOKEN com packages:write a codigo rodando a partir de um fork):
#   - push em main            -> pre-release (MinVer calcula X.Y.Z-<altura>+sha)
#   - push de tag vX.Y.Z      -> release estavel (MinVer resolve a versao exata da
#                                 tag, sem sufixo de pre-release), corte manual sem
#                                 gate formal (DA-006). Ver DA-003 em
#                                 docs/epics/in-progress/nuget-package-publishing-pipeline.md.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer precisa do historico completo + tags para calcular a versao

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Limaj.Framework.sln

      - name: Build
        run: dotnet build Limaj.Framework.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Limaj.Framework.sln --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack Limaj.Framework.sln
          --configuration Release
          --no-build
          --output ./nupkgs
          -p:MinVerBuildMetadata=sha.${GITHUB_SHA::7}

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/limajsolutions/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --no-symbols

  publish-nuget-org:
    name: Publish to nuget.org
    needs: build-test-pack
    # nuget.org e permanente (sem delete, so unlist): nunca publicar pre-release da main la.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # token OIDC trocado por API key de curta duracao (Trusted Publishing)
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # O push do .nupkg envia junto o .snupkg da mesma pasta para o symbol server.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
